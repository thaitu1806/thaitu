<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <!-- Ornate golden border -->
  <rect x="4" y="4" width="192" height="252" rx="16" stroke="url(#gold)" stroke-width="6" fill="none"/>
  <rect x="10" y="10" width="180" height="240" rx="12" stroke="url(#gold2)" stroke-width="2" fill="none"/>
  
  <!-- Corner ornaments -->
  <circle cx="14" cy="14" r="5" fill="#c9a227"/>
  <circle cx="186" cy="14" r="5" fill="#c9a227"/>
  <circle cx="14" cy="246" r="5" fill="#c9a227"/>
  <circle cx="186" cy="246" r="5" fill="#c9a227"/>
  
  <!-- Top dragon left (simplified stylized) -->
  <path d="M20 30 C25 20, 40 15, 55 20 C60 22, 62 28, 58 32 C55 35, 48 33, 45 30 C42 27, 38 25, 35 27 C32 29, 30 32, 28 30 Z" fill="url(#gold)" opacity="0.85"/>
  <path d="M20 30 C22 26, 28 24, 32 26" stroke="#8b6914" stroke-width="0.8" fill="none"/>
  <!-- Dragon eye -->
  <circle cx="50" cy="24" r="2" fill="#1a1a1a"/>
  <circle cx="49.5" cy="23.5" r="0.7" fill="#fff"/>
  <!-- Dragon horn -->
  <path d="M55 18 L58 10 L56 17" fill="#ffd700" stroke="#b8860b" stroke-width="0.5"/>
  
  <!-- Top dragon right (mirrored) -->
  <path d="M180 30 C175 20, 160 15, 145 20 C140 22, 138 28, 142 32 C145 35, 152 33, 155 30 C158 27, 162 25, 165 27 C168 29, 170 32, 172 30 Z" fill="url(#gold)" opacity="0.85"/>
  <path d="M180 30 C178 26, 172 24, 168 26" stroke="#8b6914" stroke-width="0.8" fill="none"/>
  <circle cx="150" cy="24" r="2" fill="#1a1a1a"/>
  <circle cx="150.5" cy="23.5" r="0.7" fill="#fff"/>
  <path d="M145 18 L142 10 L144 17" fill="#ffd700" stroke="#b8860b" stroke-width="0.5"/>
  
  <!-- Top center star -->
  <path d="M100 8 L103 16 L111 16 L105 21 L107 29 L100 25 L93 29 L95 21 L89 16 L97 16 Z" fill="#ffd700" stroke="#b8860b" stroke-width="0.8"/>
  
  <!-- Side scales pattern left -->
  <path d="M8 60 Q4 80, 8 100 Q4 120, 8 140 Q4 160, 8 180 Q4 200, 8 220" stroke="url(#gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="6" cy="70" r="2.5" fill="#daa520" opacity="0.6"/>
  <circle cx="6" cy="110" r="2.5" fill="#daa520" opacity="0.6"/>
  <circle cx="6" cy="150" r="2.5" fill="#daa520" opacity="0.6"/>
  <circle cx="6" cy="190" r="2.5" fill="#daa520" opacity="0.6"/>
  
  <!-- Side scales pattern right -->
  <path d="M192 60 Q196 80, 192 100 Q196 120, 192 140 Q196 160, 192 180 Q196 200, 192 220" stroke="url(#gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="194" cy="70" r="2.5" fill="#daa520" opacity="0.6"/>
  <circle cx="194" cy="110" r="2.5" fill="#daa520" opacity="0.6"/>
  <circle cx="194" cy="150" r="2.5" fill="#daa520" opacity="0.6"/>
  <circle cx="194" cy="190" r="2.5" fill="#daa520" opacity="0.6"/>
  
  <!-- Bottom dragon tails (curled) -->
  <path d="M30 240 C35 248, 50 252, 70 248 C80 246, 85 242, 80 238" stroke="url(#gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M170 240 C165 248, 150 252, 130 248 C120 246, 115 242, 120 238" stroke="url(#gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Cloud puffs top -->
  <ellipse cx="70" cy="16" rx="8" ry="5" fill="#fff8e1" opacity="0.5"/>
  <ellipse cx="130" cy="16" rx="8" ry="5" fill="#fff8e1" opacity="0.5"/>
  
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="30%" stop-color="#daa520"/>
      <stop offset="60%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#daa520" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
</svg>
