<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góc Học Tập - Lớp 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #1a0a3e 0%, #2d1b69 25%, #4a2c8a 50%, #3d1f7a 75%, #1a0a3e 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* Stars */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 15%, #fff, transparent),
        radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 45% 8%, #fff, transparent),
        radial-gradient(1px 1px at 65% 55%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 82% 20%, #fff, transparent),
        radial-gradient(1px 1px at 92% 70%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 15% 80%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.6), transparent);
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.5; } to { opacity: 1; } }

    /* Header */
    .page-header {
      position: relative; z-index: 1;
      text-align: center; padding: 30px 20px 20px;
    }
    .back-btn {
      position: absolute; top: 20px; left: 16px;
      color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 800;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 14px; border-radius: 999px; backdrop-filter: blur(8px);
    }
    .header-mascots {
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px;
    }
    .header-mascots span { font-size: 2.4rem; animation: bounce 2s ease-in-out infinite; }
    .header-mascots span:nth-child(2) { animation-delay: 0.3s; }
    @keyframes bounce { 50% { transform: translateY(-6px); } }

    .page-title {
      font-size: 2.8rem; font-weight: 900;
      background: linear-gradient(135deg, #fff, #d4c4ff, #fff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 3px 10px rgba(100,50,200,0.5));
      margin-bottom: 6px;
    }
    .page-subtitle {
      color: rgba(255,255,255,0.85); font-size: 1.1rem; font-weight: 700;
    }

    /* Grade tabs */
    .grade-tabs {
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
      margin: 16px auto 28px; max-width: 500px;
      position: relative; z-index: 1;
    }
    .grade-tab {
      padding: 10px 18px; border: none; border-radius: 18px;
      background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8);
      font-size: 0.88rem; font-weight: 800; cursor: pointer;
      font-family: inherit; backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
      transition: all 0.25s;
    }
    .grade-tab:hover { background: rgba(255,255,255,0.22); transform: translateY(-2px); }
    .grade-tab.active {
      background: rgba(255,255,255,0.92); color: #4a2c8a;
      box-shadow: 0 6px 20px rgba(100,50,200,0.5), 0 0 15px rgba(138,92,246,0.3);
      transform: translateY(-3px) scale(1.05);
    }

    /* Topic cards grid */
    .topics-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      max-width: 460px; margin: 0 auto; padding: 0 16px;
      position: relative; z-index: 1;
    }

    .topic-card {
      background: rgba(255,255,255,0.95);
      border-radius: 24px; overflow: hidden;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 28px rgba(20,5,60,0.3);
      animation: cardUp 0.5s ease both;
    }
    .topic-card:nth-child(1) { animation-delay: 0s; }
    .topic-card:nth-child(2) { animation-delay: 0.08s; }
    .topic-card:nth-child(3) { animation-delay: 0.16s; }
    .topic-card:nth-child(4) { animation-delay: 0.24s; }
    .topic-card:nth-child(5) { animation-delay: 0.32s; }
    .topic-card:nth-child(6) { animation-delay: 0.40s; }
    @keyframes cardUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .topic-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 40px rgba(100,50,200,0.4); }
    .topic-card:active { transform: scale(0.97); }

    .card-img {
      width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
      background: linear-gradient(135deg, #ede7ff, #f4f0ff);
    }
    .card-emoji-fallback {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #ede7ff, #f4f0ff);
      font-size: 3.5rem;
    }
    .card-body {
      padding: 12px 14px 16px; text-align: center;
    }
    .card-title {
      font-size: 1.05rem; font-weight: 900; color: #2a1b50; margin-bottom: 3px;
    }
    .card-desc {
      font-size: 0.78rem; font-weight: 700; color: #8a7aaa; line-height: 1.3;
    }

    /* Accent top border */
    .topic-card:nth-child(6n+1) { border-top: 4px solid #ff7a59; }
    .topic-card:nth-child(6n+2) { border-top: 4px solid #4aa3f0; }
    .topic-card:nth-child(6n+3) { border-top: 4px solid #8b5cf6; }
    .topic-card:nth-child(6n+4) { border-top: 4px solid #34c77b; }
    .topic-card:nth-child(6n+5) { border-top: 4px solid #f4b73e; }
    .topic-card:nth-child(6n+6) { border-top: 4px solid #ec5f93; }

    /* Responsive */
    @media (min-width: 600px) {
      .topics-grid { grid-template-columns: 1fr 1fr 1fr; max-width: 680px; }
    }
    @media (max-width: 360px) {
      .page-title { font-size: 2.2rem; }
      .topic-card { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <a href="/" class="back-btn"> Trang chủ</a>
    <div class="header-mascots">
      <span></span>
      <span></span>
    </div>
    <h1 class="page-title">Góc Học Tập</h1>
    <p class="page-subtitle">π Toán lớp 2 — Học qua hình ảnh!</p>
  </header>

  <nav class="grade-tabs">
    <button class="grade-tab"> 5 tuổi</button>
    <button class="grade-tab"> Lớp 1</button>
    <button class="grade-tab active"> Lớp 2</button>
    <button class="grade-tab"> Lớp 3</button>
    <button class="grade-tab"> Lớp 4</button>
    <button class="grade-tab"> Lớp 5</button>
  </nav>

  <main class="topics-grid" id="topics-grid"></main>

  <script>
    const TOPICS = [
      { id: 'clock', icon: '', name: 'Đồng Hồ', desc: 'Xoay thời gian, cứu giờ học!' },
      { id: 'units', icon: '', name: 'Đo Lường', desc: 'Thám hiểm đo lường, tìm vật lớn!' },
      { id: 'multiply', icon: '', name: 'Bảng Nhân', desc: 'Phép thuật nhân lên, biến hóa đồ vật!' },
      { id: 'carry', icon: '', name: 'Cộng Có Nhớ', desc: 'Cầu nối số 10, cứu số cộng!' },
      { id: 'shapes', icon: '', name: 'Hình Học', desc: 'Kiến trúc sư tí hon, xây thế giới!' },
      { id: 'money', icon: '', name: 'Tiền Việt Nam', desc: 'Cửa hàng Kiro, học cách mua sắm!' },
    ];

    const grid = document.getElementById('topics-grid');
    grid.innerHTML = TOPICS.map(t => `
      <div class="topic-card" onclick="alert('Mở bài: ${t.name}')">
        <img class="card-img" src="/img/learn/${t.id}.png"
             onerror="this.outerHTML='<div class=card-emoji-fallback>${t.icon}</div>'"
             alt="${t.name}">
        <div class="card-body">
          <div class="card-title">${t.name}</div>
          <div class="card-desc">${t.desc}</div>
        </div>
      </div>
    `).join('');
  </script>
  <script src="/sprite-icons.js"></script>
</body>
</html>
