<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Outer golden border -->
  <rect x="4" y="4" width="192" height="232" rx="16" stroke="url(#gold)" stroke-width="6" fill="none"/>
  <!-- Corner ornaments -->
  <circle cx="16" cy="16" r="6" fill="url(#gold)"/>
  <circle cx="184" cy="16" r="6" fill="url(#gold)"/>
  <circle cx="16" cy="224" r="6" fill="url(#gold)"/>
  <circle cx="184" cy="224" r="6" fill="url(#gold)"/>
  <!-- Top dragons (simplified) -->
  <g opacity="0.85">
    <!-- Left dragon head -->
    <path d="M30 20 C20 8, 40 2, 50 10 C55 14, 52 20, 48 22 C44 24, 38 22, 35 18 Z" fill="url(#gold)"/>
    <path d="M50 10 C56 6, 62 8, 65 14 C68 18, 64 22, 60 20" stroke="url(#gold)" stroke-width="2" fill="none"/>
    <circle cx="42" cy="14" r="2" fill="#2e7d32"/>
