    <path d="M30 22 C22 30, 12 40, 10 55 C8 70, 10 90, 12 110 C14 130, 12 150, 10 170 C8 185, 12 200, 18 215" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Left scales -->
    <path d="M14 60 L10 65 L14 70 M14 80 L10 85 L14 90 M14 100 L10 105 L14 110 M14 130 L10 135 L14 140 M14 160 L10 165 L14 170 M14 190 L10 195 L14 200" stroke="url(#gold)" stroke-width="1.5" fill="none"/>
    <!-- Right dragon head (mirrored) -->
    <path d="M170 20 C180 8, 160 2, 150 10 C145 14, 148 20, 152 22 C156 24, 162 22, 165 18 Z" fill="url(#gold)"/>
    <path d="M150 10 C144 6, 138 8, 135 14 C132 18, 136 22, 140 20" stroke="url(#gold)" stroke-width="2" fill="none"/>
    <circle cx="158" cy="14" r="2" fill="#2e7d32"/>
    <!-- Right dragon body curve -->
    <path d="M170 22 C178 30, 188 40, 190 55 C192 70, 190 90, 188 110 C186 130, 188 150, 190 170 C192 185, 188 200, 182 215" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Right scales -->
    <path d="M186 60 L190 65 L186 70 M186 80 L190 85 L186 90 M186 100 L190 105 L186 110 M186 130 L190 135 L186 140 M186 160 L190 165 L186 170 M186 190 L190 195 L186 200" stroke="url(#gold)" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Top center star -->
  <path d="M100 6 L103 12 L110 13 L105 17 L106 24 L100 20 L94 24 L95 17 L90 13 L97 12 Z" fill="#ffd700" stroke="#c68a00" stroke-width="0.5"/>
  <!-- Bottom ornament -->
  <path d="M60 232 C80 228, 90 226, 100 224 C110 226, 120 228, 140 232" stroke="url(#gold)" stroke-width="2.5" fill="none"/>
  <!-- Gradients -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="30%" stop-color="#c68a00"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
